[workspace]
resolver = "2"
members = ["modular-account"]

# Standard Soroban release profile: contracts are deployed by size, and the
# host has no unwinder, so panics abort.
[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true
