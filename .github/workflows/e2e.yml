name: e2e

on:
  schedule:
    # Run every 6 hours. Testnet resets, protocol upgrades, and RPC
    # changes will break this silently between releases, so a manual
    # run is not enough.
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  e2e:
    name: e2e scenarios on testnet
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          check-latest: true

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: testdata/gen/package-lock.json

      - name: install the pinned reference sdk
        working-directory: testdata/gen
        run: npm ci

      # Cache the Rust toolchain and Cargo registry for the contract build.
      # The toolchain is pinned by rust-toolchain.toml, and Cargo.lock pins
      # the dependencies. This avoids reinstalling the toolchain on every run.
      - uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.1
        name: cache rust toolchain and cargo registry
        with:
          path: |
            ~/.rustup
            ~/.cargo/registry
            ~/.cargo/git
            e2e/contracts/target
          key: rust-e2e-${{ hashFiles('e2e/contracts/rust-toolchain.toml', 'e2e/contracts/Cargo.lock') }}
          restore-keys: |
            rust-e2e-

      - name: install stellar-cli
        run: |
          curl -sSfL https://raw.githubusercontent.com/stellar/stellar-cli/main/install.sh | sh
          stellar --version
      - name: record tool versions
        run: bash .github/scripts/record-tool-versions.sh go . node testdata/gen/package-lock.json rust e2e/contracts/Cargo.lock stellar

      - name: build the modular-account fixture
        working-directory: e2e/contracts
        run: |
          stellar contract build
          test -f target/wasm32v1-none/release/modular_account.wasm

      - name: run e2e scenarios
        env:
          SOROAUTH_RPC_URL: ${{ secrets.SOROAUTH_RPC_URL }}
        run: |
          # pipefail so a failing `go test` fails the step. Without it the
          # pipeline's exit status is tee's, which is always 0, and every
          # scenario could fail while the job reported success.
          set -o pipefail
          go test -tags e2e -v ./e2e/... 2>&1 | tee /tmp/e2e.out

      # e2e/RESULTS.md is written by a real run and only when every
      # scenario ran. It is a deliberate act, never an automatic commit.
      # The CI run surface is what matters; RESULTS.md is committed only
      # from a local run by a human who verified it.

      - name: create failure issue on regression
        if: failure() && github.event_name == 'schedule'
        run: |
          gh issue create \
            --repo soroauth/soroauth-go \
            --title "e2e regression detected on testnet" \
            --body "The scheduled e2e run failed. This is likely caused by a testnet reset, protocol upgrade, or RPC change.\n\nCheck the workflow run: https://github.com/soroauth/soroauth-go/actions/runs/${{github.run_id}}" \
            --label area:testing --label complexity:high || true

  # The same scenarios against a local standalone network, which needs neither
  # testnet nor friendbot. It proves the suite really is network-agnostic rather
  # than testnet-shaped: the passphrase, protocol version and funding path all
  # come from the network it is pointed at. It also catches a break when testnet
  # itself is unhealthy, which is the point of running it here.
  e2e-local:
    name: e2e scenarios on a local network
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          check-latest: true

      # Cache the Rust toolchain and Cargo registry for the local contract build.
      - uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.1
        name: cache rust toolchain and cargo registry
        with:
          path: |
            ~/.rustup
            ~/.cargo/registry
            ~/.cargo/git
            e2e/contracts/target
          key: rust-e2e-local-${{ hashFiles('e2e/contracts/rust-toolchain.toml', 'e2e/contracts/Cargo.lock') }}
          restore-keys: |
            rust-e2e-local-

      - name: install stellar-cli
        run: |
          curl -sSfL https://raw.githubusercontent.com/stellar/stellar-cli/main/install.sh | sh
          stellar --version
      - name: record tool versions
        run: bash .github/scripts/record-tool-versions.sh go . rust e2e/contracts/Cargo.lock stellar

      - name: run e2e scenarios against a local quickstart
        run: make e2e-local

      # The protocol version the local network reported is in this file; it is
      # printed rather than committed so a reviewer can see it without a run
      # writing into the repository.
      - name: show the local results
        if: always()
        run: |
          if [ -f e2e/RESULTS.local.md ]; then
            echo '::group::e2e/RESULTS.local.md'
            cat e2e/RESULTS.local.md
            echo '::endgroup::'
          fi
