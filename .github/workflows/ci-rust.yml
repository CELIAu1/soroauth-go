# Rust crate: byte-equal replay of every golden vector, error distinctions,
# and a clean clippy/fmt gate.
#
# Runs when the crate, the vectors, or the harness it shares a pin with
# changes.
name: ci / rust

on:
  # Advisory checks do not run on pull requests. Only the two jobs the
  # branch ruleset requires do, so a contributor sees two checks and not a
  # wall of them. These run when the change reaches main, and can be run
  # by hand from the Actions tab at any time.
  push:
    branches: [main]
    paths:
      - "bindings/rust/**"
      - "testdata/vectors/**"
      - "testdata/parity-rust/**"
      # A workflow's own definition is in its paths, so an edit to this
      # file re-runs it. Without this line a change to this workflow
      # cannot validate itself.
      - ".github/workflows/ci-rust.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust:
    name: rust crate over the signing core
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # Cache the Rust toolchain and Cargo registry. The toolchain is pinned
      # by rust-toolchain.toml (1.93.0), and Cargo.lock pins the dependencies.
      # The cache key includes both so a stale cache cannot mask a dependency
      # or toolchain change.
      - uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.1
        name: cache rust toolchain and cargo registry
        with:
          path: |
            ~/.rustup
            ~/.cargo/registry
            ~/.cargo/git
            bindings/rust/target
          key: rust-${{ hashFiles('bindings/rust/rust-toolchain.toml', 'bindings/rust/Cargo.lock') }}
          restore-keys: |
            rust-
      - name: record tool versions
        run: bash .github/scripts/record-tool-versions.sh rust bindings/rust/Cargo.lock
      - name: golden replay with byte equality
        working-directory: bindings/rust
        run: cargo test --locked
      - name: clippy
        working-directory: bindings/rust
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: formatting
        working-directory: bindings/rust
        run: cargo fmt --check
