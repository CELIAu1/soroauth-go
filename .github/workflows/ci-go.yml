# Advisory checks that depend on Go source anywhere in the tree.
#
# Runs only when Go code or the module definition changes, so a docs-only
# change does not report them at all.
name: ci / go

on:
  # Advisory checks do not run on pull requests. Only the two jobs the
  # branch ruleset requires do, so a contributor sees two checks and not a
  # wall of them. These run when the change reaches main, and can be run
  # by hand from the Actions tab at any time.
  push:
    branches: [main]
    paths:
      # '*.go' is listed alongside '**/*.go' deliberately: the root-level
      # library files are the ones everything else depends on, and relying on
      # '**' to cover a path with no directory component is the kind of detail
      # that silently stops matching.
      - '*.go'
      - '**/*.go'
      - 'go.mod'
      - 'go.sum'
      # A workflow's own definition is in its paths, so an edit to this
      # file re-runs it. Without this line a change to this workflow
      # cannot validate itself: #294 changed only this file, matched
      # nothing here, and landed on main with its new job never run.
      - '.github/workflows/ci-go.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  coverage:
    name: per-package coverage floors
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          check-latest: true
      - name: record tool versions
        run: bash .github/scripts/record-tool-versions.sh go .
      # Per-package floors from testdata/coverage/floors.json, not one global
      # floor. A single floor let a well-covered package subsidise a thin one:
      # the signing path was averaged together with the CLI and the examples,
      # so a regression in the path that produces signatures could hide behind
      # the rest. The signing-path packages carry floors strictly above the
      # 60% global floor this scheme replaced; scripts/checkcov enforces that
      # minimum as policy.
      #
      # Coverage is not correctness: it says which lines ran, not that the
      # result is right. The mutation-testing work is the stronger check;
      # these floors are a tripwire for regressions, not evidence of
      # correctness.
      #
      # The package list is a file input to the checker so the checker stays
      # hermetic and unit-testable, mirroring scripts/checkbench.
      - name: run tests with coverage
        run: |
          # The floors were measured with the toolchain go.mod pins, and
          # statement counts move between Go minor versions (go1.27 counts the
          # server package ~4.5 points lower than go1.25.4), so this runs the
          # measurement under that same toolchain. `make coverage` does the
          # same.
          export GOTOOLCHAIN="$(awk '/^toolchain /{print $2}' go.mod)"
          go test -coverprofile=coverage.out -covermode=atomic ./...
          echo "=== Coverage report ==="
          go tool cover -func=coverage.out
      - name: generate the package list
        run: go list -f '{{.ImportPath}}' ./... > packages.txt
      - name: check per-package floors
        run: go run ./scripts/checkcov coverage.out testdata/coverage/floors.json packages.txt
      - name: publish coverage
        uses: codecov/codecov-action@v7
        with:
          files: ./coverage.out
          fail_ci_if_error: false
          verbose: true

  cross-compile:
    name: cross-compile release targets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          check-latest: true
      - name: record tool versions
        run: bash .github/scripts/record-tool-versions.sh go .
      # One job building every release target, rather than a matrix. A matrix
      # reports one check per target, which turned a contributor's pull request
      # into ten checks for six jobs and buried the two that actually gate the
      # merge. Building five targets takes seconds; the toolchain setup is what
      # costs, and this pays it once.
      - name: build every release target
        run: |
          set -euo pipefail
          failed=0
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64; do
            goos="${target%%/*}"
            goarch="${target##*/}"
            echo "::group::$goos/$goarch"
            if GOOS="$goos" GOARCH="$goarch" go build ./... ; then
              echo "ok $goos/$goarch"
            else
              echo "::error::build failed for $goos/$goarch"
              failed=1
            fi
            echo "::endgroup::"
          done
          exit "$failed"
  # A fuzz run is not a pull-request check: pull requests are capped at the
  # five checks (the three ci.yml reports plus codeql and dependency review in
  # security.yml), and 30 seconds per target per push would slow
  # every review for targets whose job is to find inputs over time, not to
  # gate one diff. It runs on push to main and on demand, and the seed corpora
  # in testdata/fuzz are what a pull request actually exercises, through the
  # ordinary `go test ./...` in "vet and test".
  #
  # Every target is a step of this one job rather than a job each, so the row
  # count does not grow with each target added.
  fuzz:
    name: fuzz targets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          check-latest: true
      - name: record tool versions
        run: bash .github/scripts/record-tool-versions.sh go .
      - name: fuzz ValidateDelegateOrder
        run: go test -run='^$' -fuzz=FuzzValidateDelegateOrder -fuzztime=30s .
      - name: fuzz Inspect
        run: go test -run='^$' -fuzz=FuzzInspect -fuzztime=30s .
      - name: fuzz Preimage
        run: go test -run='^$' -fuzz=FuzzPreimage -fuzztime=30s .
      - name: fuzz Payload
        run: go test -run='^$' -fuzz=FuzzPayload -fuzztime=30s .
      - name: fuzz DecodeAuthorizationEntry
        run: go test -run='^$' -fuzz=FuzzDecodeAuthorizationEntry -fuzztime=30s .
      - name: fuzz VerifyEntry
        run: go test -run='^$' -fuzz=FuzzVerifyEntry -fuzztime=30s .
      - name: fuzz DiffEntries
        run: go test -run='^$' -fuzz=FuzzDiffEntries -fuzztime=30s .
      - name: FuzzCanonicalJSON
        run: go test -run='^$' -fuzz=FuzzCanonicalJSON -fuzztime=30s .
      # The xdrcopy round-trip target: a copy must be byte-identical to its
      # source and share no memory with it. It lives in its own package, so it
      # needs its own invocation.
      - name: fuzz the xdrcopy round-trip
        run: go test -run='^$' -fuzz=FuzzCopyRoundTrip -fuzztime=30s ./internal/xdrcopy

  bench:
    name: signing-path budgets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          check-latest: true
      - name: record tool versions
        run: bash .github/scripts/record-tool-versions.sh go .
      # ns/op is deliberately not gated: wall-clock on a shared runner is too
      # noisy to be evidence. allocs/op and B/op are deterministic and are
      # compared against testdata/bench/budgets.json.
      - name: run signing-path benchmarks
        run: go test -run '^$' -bench . -benchmem -count=1 . | tee bench.out
      - name: fail on allocation or byte regression
        run: go run ./scripts/checkbench bench.out testdata/bench/budgets.json
